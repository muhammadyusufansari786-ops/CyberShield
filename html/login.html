<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your CyberShield account to see your dashboard, quiz performance and saved analyses.">
  <title>Sign In – CyberShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='60' font-weight='bold'%3E⚡%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#main-content" class="visually-hidden focus-visible">Skip to main content</a>

  <header class="header" role="banner">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="CyberShield Home">
        <span class="logo-icon" aria-hidden="true">🛡️</span>
        <span>CyberShield</span>
      </a>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" role="main">
    <section class="section" style="padding-top: 4rem; padding-bottom: 4rem;">
      <div class="auth-wrap">
        <div class="card">
          <header class="card-header" style="text-align: center; justify-content: center;">
            <div>
              <div style="font-size: 2.5rem; margin-bottom: 0.5rem;" aria-hidden="true">🛡️</div>
              <h1 class="card-title" style="font-size: 1.5rem;">Welcome back</h1>
              <p class="card-subtitle" style="margin-top: 0.25rem;">Sign in to your CyberShield account</p>
            </div>
          </header>

          <div id="auth-error" class="auth-error" role="alert" aria-live="assertive"></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="login-email" class="form-label">Email</label>
              <input type="email" id="login-email" class="form-input" name="email" autocomplete="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
              <label for="login-password" class="form-label">Password</label>
              <div class="input-wrapper">
                <input type="password" id="login-password" class="form-input" name="password" autocomplete="current-password" placeholder="Your password" required>
                <button type="button" class="toggle-visibility" aria-label="Show password">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>

            <button type="submit" id="login-submit" class="btn btn-primary btn-lg" style="width: 100%;">Sign In</button>
          </form>

          <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9375rem; color: var(--color-text-secondary);">
            New to CyberShield?
            <a href="register.html" style="color: var(--color-primary); font-weight: 600;">Create an account</a>
          </p>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--color-text-muted);">
          <a href="index.html" style="color: var(--color-text-muted);">← Back to CyberShield home</a>
        </p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="footer" role="contentinfo" aria-label="Site footer"></footer>

  <script src="../js/main.js"></script>
  <script src="../js/footer.js" defer></script>
  <script src="../js/auth.js" defer></script>
</body>
</html>
