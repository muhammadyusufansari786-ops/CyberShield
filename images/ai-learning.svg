<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="55%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Stage/step nodes -->
  <g>
    <!-- Step 1 -->
    <circle cx="120" cy="280" r="28" fill="#0f1929" stroke="#60a5fa" stroke-width="3"/>
    <text x="120" y="288" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="20" font-weight="700">1</text>

    <!-- Step 2 -->
    <circle cx="240" cy="140" r="28" fill="#0f1929" stroke="#2dd4bf" stroke-width="3"/>
    <text x="240" y="148" text-anchor="middle" fill="#2dd4bf" font-family="system-ui" font-size="20" font-weight="700">2</text>

    <!-- Step 3 (top) -->
    <circle cx="380" cy="100" r="32" fill="#0f1929" stroke="#c084fc" stroke-width="4"/>
    <text x="380" y="108" text-anchor="middle" fill="#c084fc" font-family="system-ui" font-size="22" font-weight="700">3</text>

    <!-- Step 4 -->
    <circle cx="480" cy="200" r="28" fill="#0f1929" stroke="#f87171" stroke-width="3"/>
    <text x="480" y="208" text-anchor="middle" fill="#f87171" font-family="system-ui" font-size="20" font-weight="700">4</text>
  </g>

  <!-- Connecting paths -->
  <g fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 6" opacity="0.7">
    <path d="M148 262 Q190 200 212 158"/>
    <path d="M268 122 Q320 110 350 106"/>
    <path d="M408 116 Q440 150 456 186"/>
  </g>

  <!-- AI brain/icon at top center -->
  <g transform="translate(380 40)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M-8 -8 L8 0 L-8 8" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(380 160)">
    <!-- Cap body -->
    <path d="M-40 -10 L40 -10 L30 15 L-30 15 Z" fill="url(#capGrad)" stroke="#0f766e" stroke-width="2"/>
    <!-- Tassel -->
    <path d="M40 -10 L50 10 L42 10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="12" r="4" fill="#fbbf24"/>
    <!-- Button -->
    <circle cx="0" cy="-10" r="6" fill="#0f1929" stroke="#0f766e" stroke-width="2"/>
  </g>

  <!-- Books/knowledge stack -->
  <g transform="translate(180 290)">
    <rect x="0" y="0" width="100" height="14" rx="2" fill="#0f1929" stroke="#60a5fa" stroke-width="2"/>
    <rect x="2" y="-14" width="96" height="14" rx="2" fill="#0f1929" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="4" y="-28" width="92" height="14" rx="2" fill="#0f1929" stroke="#c084fc" stroke-width="2"/>
    <line x1="10" y1="-10" x2="40" y2="-10" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="10" y1="-24" x2="35" y2="-24" stroke="#2dd4bf" stroke-width="1.5"/>
  </g>

  <!-- Growth chart element -->
  <g transform="translate(460 280)">
    <rect x="0" y="20" width="20" height="40" fill="#0f1929" stroke="#fbbf24" stroke-width="2"/>
    <rect x="25" y="0" width="20" height="60" fill="#0f1929" stroke="#34d399" stroke-width="2"/>
    <rect x="50" y="10" width="20" height="50" fill="#0f1929" stroke="#f87171" stroke-width="2"/>
    <polyline points="10,20 35,0 55,10" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle effects -->
  <g fill="#fbbf24">
    <circle cx="320" cy="60" r="3"/>
    <circle cx="440" cy="50" r="2.5"/>
    <circle cx="310" cy="180" r="2"/>
  </g>
</svg>
