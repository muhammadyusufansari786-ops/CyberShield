<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Server/database -->
  <g transform="translate(160 140)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#0f1929" stroke="#60a5fa" stroke-width="3"/>
    <rect x="10" y="10" width="160" height="10" rx="2" fill="#0f1929" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="25" cy="15" r="3" fill="#60a5fa"/>
    <circle cx="35" cy="15" r="3" fill="#2dd4bf"/>
    <circle cx="45" cy="15" r="3" fill="#fbbf24"/>
    <rect x="10" y="30" width="160" height="80" fill="#0b1220" stroke="#60a5fa" stroke-opacity="0.3"/>
    <!-- data rows -->
    <g stroke="#60a5fa" stroke-width="1.5" opacity="0.6">
      <line x1="20" y1="45" x2="100" y2="45"/>
      <line x1="20" y1="55" x2="150" y2="55"/>
      <line x1="20" y1="65" x2="120" y2="65"/>
      <line x1="20" y1="75" x2="90" y2="75"/>
      <line x1="20" y1="85" x2="140" y2="85"/>
      <line x1="20" y1="95" x2="110" y2="95"/>
    </g>
    <!-- leak indicator -->
    <rect x="120" y="50" width="40" height="15" rx="2" fill="#f87171" opacity="0.3"/>
  </g>

  <!-- Leaking data flow -->
  <g fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 5" opacity="0.8">
    <path d="M340 160 Q400 150 450 180"/>
    <path d="M340 180 Q420 200 480 210"/>
    <path d="M340 200 Q440 230 500 260"/>
  </g>

  <!-- Data packets leaking -->
  <g fill="#f87171">
    <rect x="430" y="170" width="20" height="12" rx="2"/>
    <rect x="460" y="195" width="20" height="12" rx="2"/>
    <rect x="480" y="245" width="20" height="12" rx="2"/>
  </g>

  <!-- User icons affected -->
  <g transform="translate(400 280)">
    <g fill="none" stroke="#60a5fa" stroke-width="2">
      <circle cx="0" cy="-10" r="12"/>
      <path d="M-15 25 Q-15 5 0 5 Q15 5 15 25"/>
    </g>
    <g fill="#f87171" opacity="0.8">
      <rect x="-12" y="-12" width="24" height="3" rx="1"/>
      <circle cx="0" cy="-10" r="3"/>
    </g>
  </g>

  <g transform="translate(480 290)">
    <g fill="none" stroke="#60a5fa" stroke-width="2">
      <circle cx="0" cy="-10" r="12"/>
      <path d="M-15 25 Q-15 5 0 5 Q15 5 15 25"/>
    </g>
    <g fill="#f87171" opacity="0.8">
      <rect x="-12" y="-12" width="24" height="3" rx="1"/>
      <circle cx="0" cy="-10" r="3"/>
    </g>
  </g>

  <!-- Alert symbol -->
  <g transform="translate(100 280)">
    <path d="M0 -25 L22 15 L-22 15 Z" fill="#0f1929" stroke="#fbbf24" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="18" font-weight="700">!</text>
  </g>

  <!-- Stats -->
  <g transform="translate(340 320)">
    <text x="0" y="0" fill="#60a5fa" font-family="system-ui" font-size="11" font-weight="600">RECORDS EXPOSED</text>
    <text x="0" y="20" fill="#f87171" font-family="system-ui" font-size="14" font-weight="700">2.4M+</text>
  </g>
</svg>
