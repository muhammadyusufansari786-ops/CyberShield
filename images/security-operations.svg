<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Scanning radar -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 6" opacity="0.7">
    <circle cx="300" cy="200" r="80"/>
    <circle cx="300" cy="200" r="120"/>
    <circle cx="300" cy="200" r="160"/>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="3">
    <path d="M220 200 A80 80 0 0 1 380 200" stroke-opacity="0.9"/>
  </g>

  <!-- Center shield -->
  <g fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round">
    <path d="M300 100 L360 140 L360 220 C360 265 330 290 300 300 C270 290 240 265 240 220 L240 140 Z" stroke-width="4"/>
  </g>
  <path d="M270 200 L295 225 L335 170" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Threat markers -->
  <g fill="#f87171">
    <circle cx="180" cy="150" r="5"/>
    <circle cx="420" cy="130" r="5"/>
    <circle cx="160" cy="280" r="4"/>
    <circle cx="440" cy="290" r="4"/>
  </g>
  <g fill="none" stroke="#f87171" stroke-width="2">
    <line x1="180" y1="150" x2="230" y2="180"/>
    <line x1="420" y1="130" x2="370" y2="170"/>
  </g>

  <!-- Protected items -->
  <g fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 4">
    <rect x="200" y="320" width="60" height="40" rx="4"/>
    <rect x="340" y="320" width="60" height="40" rx="4"/>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <path d="M230 340v20M260 340v20M290 340v20"/>
    <path d="M370 340v20M400 340v20M430 340v20"/>
  </g>
</svg>
