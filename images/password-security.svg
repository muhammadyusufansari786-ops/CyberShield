<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="55%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Large central lock -->
  <g transform="translate(180 100)">
    <!-- Shackle -->
    <path d="M80 100 L80 70 C80 30 120 30 120 70 L120 100" fill="none" stroke="url(#lockGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="50" y="100" width="140" height="100" rx="12" fill="#0f1929" stroke="url(#lockGrad)" stroke-width="8"/>
    <!-- Keyhole -->
    <circle cx="120" cy="140" r="14" fill="#0f766e"/>
    <rect x="115" y="140" width="10" height="24" rx="2" fill="#0f766e"/>
    <!-- Keyhole glow -->
    <circle cx="120" cy="140" r="20" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3 4" opacity="0.7"/>
  </g>

  <!-- Strength meter bar -->
  <g transform="translate(380 160)">
    <text x="0" y="0" fill="#60a5fa" font-family="system-ui" font-size="14" font-weight="600">STRENGTH</text>
    <g transform="translate(0 20)">
      <rect x="0" y="0" width="200" height="12" rx="6" fill="#0f1929" stroke="#60a5fa" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="160" height="12" rx="6" fill="url(#lockGrad)"/>
      <rect x="0" y="0" width="160" height="12" rx="6" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    </g>
    <text x="0" y="45" fill="#34d399" font-family="system-ui" font-size="12" font-weight="600">STRONG</text>
  </g>

  <!-- Password requirements checkmarks -->
  <g transform="translate(380 220)">
    <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round">
      <path d="M0 0 L8 8 L20 2"/>
    </g>
    <text x="28" y="6" fill="#34d399" font-family="system-ui" font-size="11">12+ characters</text>

    <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" transform="translate(0 22)">
      <path d="M0 0 L8 8 L20 2"/>
    </g>
    <text x="28" y="28" fill="#34d399" font-family="system-ui" font-size="11">Mixed case</text>

    <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" transform="translate(0 44)">
      <path d="M0 0 L8 8 L20 2"/>
    </g>
    <text x="28" y="50" fill="#34d399" font-family="system-ui" font-size="11">Numbers</text>

    <g fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" transform="translate(0 66)">
      <path d="M0 0 L8 8 L20 2"/>
    </g>
    <text x="28" y="72" fill="#fbbf24" font-family="system-ui" font-size="11">Symbols recommended</text>
  </g>

  <!-- Binary/hex decoration -->
  <g fill="#60a5fa" font-family="monospace" font-size="10" opacity="0.4">
    <text x="50" y="340">01101000</text>
    <text x="120" y="340">01100101</text>
    <text x="190" y="340">01111000</text>
    <text x="50" y="360">a7f3c91e</text>
    <text x="110" y="360">b2d8e4f0</text>
  </g>
</svg>
