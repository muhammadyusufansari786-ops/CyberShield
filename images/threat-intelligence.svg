<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Globe -->
  <g transform="translate(300 200)">
    <circle cx="0" cy="0" r="100" fill="#0f1929" stroke="#60a5fa" stroke-width="3"/>
    <!-- latitude lines -->
    <g stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.6">
      <ellipse cx="0" cy="-40" rx="90" ry="25"/>
      <ellipse cx="0" cy="0" rx="100" ry="30"/>
      <ellipse cx="0" cy="40" rx="90" ry="25"/>
    </g>
    <!-- longitude lines -->
    <g stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.6">
      <ellipse cx="0" cy="0" rx="30" ry="100"/>
      <ellipse cx="0" cy="0" rx="60" ry="100"/>
      <ellipse cx="0" cy="0" rx="90" ry="100"/>
    </g>

    <!-- Threat markers on globe -->
    <g fill="#f87171">
      <circle cx="40" cy="-30" r="5"/>
      <circle cx="-20" cy="20" r="4"/>
      <circle cx="60" cy="40" r="4"/>
      <circle cx="-50" cy="-20" r="3"/>
    </g>
    <g fill="#fbbf24">
      <circle cx="0" cy="-60" r="3"/>
      <circle cx="-40" cy="50" r="3"/>
    </g>
  </g>

  <!-- Connection arcs to edge nodes -->
  <g fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7">
    <path d="M340 170 Q450 140 500 80" />
    <path d="M260 230 Q150 250 100 300" />
    <path d="M340 230 Q450 260 500 320" />
    <path d="M260 170 Q150 150 100 100" />
  </g>

  <!-- Edge threat nodes -->
  <g>
    <rect x="490" y="60" width="24" height="24" rx="4" fill="#0f1929" stroke="#f87171" stroke-width="2"/>
    <circle cx="502" cy="72" r="4" fill="#f87171"/>
  </g>
  <g>
    <rect x="80" y="280" width="24" height="24" rx="4" fill="#0f1929" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="92" cy="292" r="4" fill="#fbbf24"/>
  </g>
  <g>
    <rect x="490" y="300" width="24" height="24" rx="4" fill="#0f1929" stroke="#f87171" stroke-width="2"/>
    <circle cx="502" cy="312" r="4" fill="#f87171"/>
  </g>
  <g>
    <rect x="80" y="80" width="24" height="24" rx="4" fill="#0f1929" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="92" cy="92" r="4" fill="#2dd4bf"/>
  </g>

  <!-- Feed panel bottom -->
  <rect x="50" y="340" width="500" height="40" rx="6" fill="#0f1929" stroke="#60a5fa" stroke-opacity="0.4"/>
  <g stroke="#60a5fa" stroke-width="2">
    <path d="M70 360v-10M90 360v-10M110 360v-10M130 360v-10M150 360v-10"/>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3 3">
    <path d="M180 360v-10M200 360v-10M220 360v-10"/>
  </g>
  <g stroke="#f87171" stroke-width="2" stroke-dasharray="3 3">
    <path d="M240 360v-10M260 360v-10"/>
  </g>
</svg>
