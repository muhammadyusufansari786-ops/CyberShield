<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1929"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Browser window -->
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="380" height="240" rx="10" fill="url(#browserGrad)" stroke="#60a5fa" stroke-width="2"/>
    <!-- title bar -->
    <rect x="0" y="0" width="380" height="32" rx="10" fill="#0b1220" stroke="#60a5fa" stroke-opacity="0.3"/>
    <rect x="0" y="16" width="380" height="16" fill="#0b1220"/>
    <!-- window controls -->
    <circle cx="16" cy="16" r="5" fill="#f87171"/>
    <circle cx="30" cy="16" r="5" fill="#fbbf24"/>
    <circle cx="44" cy="16" r="5" fill="#34d399"/>
    <!-- URL bar -->
    <rect x="55" y="8" width="240" height="18" rx="4" fill="#0f1929" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="68" y="20" fill="#2dd4bf" font-family="monospace" font-size="9">https://example.com/secure</text>
    <!-- padlock in URL bar -->
    <g transform="translate(310 12)">
      <rect x="0" y="4" width="8" height="6" rx="1" fill="#34d399"/>
      <path d="M1 4 L1 1 C1 0 4 0 4 1 L4 4" fill="none" stroke="#34d399" stroke-width="1.5"/>
    </g>
    <!-- page content -->
    <g transform="translate(10 40)">
      <rect x="0" y="0" width="360" height="190" fill="#0b1220"/>
      <!-- page header -->
      <rect x="0" y="0" width="360" height="30" fill="#0f1929"/>
      <text x="10" y="20" fill="#60a5fa" font-family="system-ui" font-size="12" font-weight="600">Secure Banking Login</text>
      <!-- content rows -->
      <g stroke="#60a5fa" stroke-width="1.5" opacity="0.5">
        <line x1="10" y1="50" x2="200" y2="50"/>
        <line x1="10" y1="65" x2="280" y2="65"/>
        <line x1="10" y1="80" x2="240" y2="80" opacity="0.7"/>
      </g>
      <!-- input fields -->
      <rect x="10" y="95" width="200" height="28" rx="4" fill="#0b1220" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="10" y="130" width="200" height="28" rx="4" fill="#0b1220" stroke="#60a5fa" stroke-width="1.5"/>
      <!-- secure indicator -->
      <g transform="translate(220 105)">
        <rect x="0" y="0" width="80" height="20" rx="10" fill="#0f766e"/>
        <text x="40" y="14" text-anchor="middle" fill="#0f1929" font-family="system-ui" font-size="9" font-weight="700">256-bit</text>
      </g>
      <!-- login button -->
      <rect x="10" y="170" width="80" height="20" rx="4" fill="#0f766e"/>
      <text x="50" y="184" text-anchor="middle" fill="#0f1929" font-family="system-ui" font-size="10" font-weight="700">Sign In</text>
    </g>
  </g>

  <!-- Large padlock -->
  <g transform="translate(480 140)">
    <rect x="30" y="70" width="60" height="50" rx="6" fill="#0f1929" stroke="#34d399" stroke-width="3"/>
    <path d="M45 70 L45 50 C45 35 75 35 75 50 L75 70" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="82" r="6" fill="#0f766e"/>
    <rect x="56" y="82" width="8" height="12" rx="1" fill="#0f766e"/>
    <!-- glow ring -->
    <circle cx="60" cy="95" r="35" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="60" cy="95" r="45" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3 6" opacity="0.3"/>
  </g>

  <!-- Security indicators around -->
  <g>
    <g transform="translate(80 60)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round">
      <path d="M0 8 L4 12 L10 4"/>
    </g>
    <text x="18" y="30" fill="#34d399" font-family="system-ui" font-size="10">SSL Active</text>

    <g transform="translate(520 60)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round">
      <path d="M0 8 L4 12 L10 4"/>
    </g>
    <text x="60" y="30" fill="#2dd4bf" font-family="system-ui" font-size="10">DNS Filter</text>
  </g>

  <!-- Shield in corner -->
  <g transform="translate(200 320)">
    <path d="M0 -30 L30 -15 L30 15 C30 30 15 40 0 45 C-15 40 -30 30 -30 15 L-30 -15 Z" fill="#0f1929" stroke="#0f766e" stroke-width="2"/>
    <path d="M-12 5 L-4 12 L12 -7" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Data protection rays -->
  <g fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5">
    <line x1="500" y1="200" x2="560" y2="180"/>
    <line x1="500" y1="220" x2="570" y2="220"/>
    <line x1="500" y1="240" x2="560" y2="260"/>
  </g>
</svg>
