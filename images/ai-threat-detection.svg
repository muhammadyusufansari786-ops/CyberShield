<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Email/document card -->
  <g fill="none" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round">
    <rect x="120" y="100" width="260" height="180" rx="8"/>
    <path d="M120 130h260"/>
    <rect x="140" y="150" width="100" height="8" rx="4"/>
    <rect x="140" y="170" width="180" height="6" rx="3"/>
    <rect x="140" y="186" width="140" height="6" rx="3"/>
    <rect x="140" y="206" width="200" height="50" rx="4" fill="#0f1929"/>
  </g>

  <!-- Suspicious link highlight -->
  <g fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round">
    <path d="M160 220h80M250 220h30"/>
  </g>
  <g fill="#f87171">
    <circle cx="155" cy="220" r="3"/>
    <circle cx="285" cy="220" r="3"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(320 140)">
    <circle cx="80" cy="80" r="65" fill="none" stroke="url(#lensGrad)" stroke-width="8"/>
    <path d="M128 128 L165 165" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="50" fill="#0f1929" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- magnified suspicious content -->
    <rect x="50" y="65" width="60" height="8" rx="2" fill="#f87171" opacity="0.9"/>
    <rect x="50" y="80" width="45" height="6" rx="2"/>
    <rect x="50" y="92" width="55" height="6" rx="2"/>
    <g fill="#fbbf24">
      <circle cx="100" cy="70" r="4"/>
      <circle cx="108" cy="70" r="4"/>
    </g>
  </g>

  <!-- Analysis rays -->
  <g stroke="#c084fc" stroke-width="2" stroke-dasharray="3 5" opacity="0.7">
    <line x1="400" y1="200" x2="470" y2="200"/>
    <line x1="400" y1="220" x2="490" y2="220"/>
    <line x1="400" y1="240" x2="470" y2="240"/>
  </g>

  <!-- Result badge -->
  <g fill="none" stroke="#f87171" stroke-width="3" stroke-linejoin="round">
    <rect x="470" y="120" width="100" height="60" rx="8"/>
  </g>
  <g fill="#f87171">
    <circle cx="520" cy="145" r="8"/>
  </g>
  <text x="520" y="175" text-anchor="middle" fill="#f87171" font-family="system-ui" font-size="10" font-weight="700">HIGH RISK</text>
</svg>
